[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktree-manager"
version = "1.8.1"
description = "Git worktree manager with Docker Compose isolation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jeremy MacCormack", email = "j.i.maccormack@gmail.com" }
]
keywords = [
    "git",
    "worktree",
    "docker",
    "docker-compose",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "rich>=13.0.0",
    "filelock>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
worktree-manager = "worktree_manager.cli:main"
wt = "worktree_manager.cli:main"

[project.urls]
Homepage = "https://github.com/bellbird-bakery/worktree-manager"
Documentation = "https://github.com/bellbird-bakery/worktree-manager#readme"
Repository = "https://github.com/bellbird-bakery/worktree-manager"
Issues = "https://github.com/bellbird-bakery/worktree-manager/issues"

[tool.hatch.build.targets.wheel]
packages = ["worktree_manager"]

[tool.hatch.build.targets.sdist]
include = [
    "worktree_manager/**/*.py",
    "scripts/*.sh",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
